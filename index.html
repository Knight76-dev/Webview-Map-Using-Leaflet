<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Boundary Comparison</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        html, body, #map {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        .search-box {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(255,255,255,0.96);
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            width: 260px;
            font-family: Arial, sans-serif;
        }

        .search-box input {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .search-box button {
            width: 100%;
            padding: 10px;
            background: #0078ff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .search-box button:hover {
            background: #005fcc;
        }

        .legend {
            margin-top: 10px;
            font-size: 14px;
        }

        .legend span {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 6px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

<div id="map"></div>

<div class="search-box">
    <input type="text" id="city1" placeholder="e.g. Kolkata">
    <input type="text" id="city2" placeholder="e.g. Kharagpur">
    <button id="compareBtn">Show Boundaries</button>

    <div class="legend">
        <div><span style="background:red;"></span> City 1</div>
        <div><span style="background:blue;"></span> City 2</div>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// Initialize map
const map = L.map('map').setView([22.5, 87.3], 8);

// Base map
const osm = L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);

// Satellite layer
const satellite = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
        attribution: 'Tiles &copy; Esri'
    }
);

// Layer control
L.control.layers(
    { 'OpenStreetMap': osm, 'Satellite': satellite }
).addTo(map);

// Store displayed layers
let cityLayers = [];

// Exact OSM relation IDs
const relationIds = {
    'kolkata': 1952843,
    'medinipur': 3258122,
    'midnapore': 3258122,
    'kharagpur': 3258461
};

// Fetch boundary from Overpass
async function fetchCityBoundary(cityName) {

    const key = cityName.trim().toLowerCase();
    const relationId = relationIds[key];

    if (!relationId) {
        alert('Boundary relation ID not configured for: ' + cityName);
        return null;
    }

    const query = `
        [out:json][timeout:25];
        relation(${relationId});
        out geom;
    `;

    const url =
      'https://overpass-api.de/api/interpreter?data=' +
      encodeURIComponent(query);

    try {
        const response = await fetch(url);

        if (!response.ok) {
            throw new Error('HTTP ' + response.status);
        }

        const data = await response.json();

        if (!data.elements || data.elements.length === 0) {
            alert('Boundary not found for: ' + cityName);
            return null;
        }

        const rel = data.elements[0];

        const polygons = rel.members
            .filter(m => m.role === 'outer' && m.geometry)
            .map(m =>
                m.geometry.map(p => [p.lon, p.lat])
            );

        if (polygons.length === 0) {
            alert('No polygon geometry found for: ' + cityName);
            return null;
        }

        return {
            type: 'Feature',
            properties: { name: cityName },
            geometry: polygons.length > 1
                ? {
                    type: 'MultiPolygon',
                    coordinates: polygons.map(r => [r])
                }
                : {
                    type: 'Polygon',
                    coordinates: [polygons[0]]
                }
        };

    } catch (error) {
        console.error(error);
        alert('Error fetching boundary for: ' + cityName);
        return null;
    }
}

// Add boundary to map
function addCityToMap(cityName, geojson, color) {

    const layer = L.geoJSON(geojson, {
        style: {
            color: color,
            weight: 3,
            opacity: 0.9,
            fillOpacity: 0.15
        }
    }).bindPopup('<b>' + cityName + '</b>');

    layer.addTo(map);
    cityLayers.push(layer);
}

// Compare button
document.getElementById('compareBtn')
    .addEventListener('click', async () => {

    const city1 = document.getElementById('city1').value.trim();
    const city2 = document.getElementById('city2').value.trim();

    if (!city1 && !city2) {
        alert('Enter at least one city.');
        return;
    }

    // Clear previous layers
    cityLayers.forEach(layer => map.removeLayer(layer));
    cityLayers = [];

    // City 1
    if (city1) {
        const geo1 = await fetchCityBoundary(city1);
        if (geo1) addCityToMap(city1, geo1, 'red');
    }

    // City 2
    if (city2) {
        const geo2 = await fetchCityBoundary(city2);
        if (geo2) addCityToMap(city2, geo2, 'blue');
    }

    // Zoom to fit
    if (cityLayers.length > 0) {
        const group = L.featureGroup(cityLayers);
        map.fitBounds(group.getBounds(), { padding: [20, 20] });
    }
});
</script>

</body>
</html>
