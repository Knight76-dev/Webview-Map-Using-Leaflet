<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Compare Two City Boundaries</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        html, body, #map {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        .search-box {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(255,255,255,0.96);
            padding: 12px 14px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            font-family: Arial, sans-serif;
            width: 240px;
        }

        .search-box input {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .search-box button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            background: #0078ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .search-box button:hover {
            background: #005fcc;
        }

        .legend {
            margin-top: 10px;
            font-size: 13px;
        }

        .legend span {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 6px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

<div id="map"></div>

<div class="search-box">
    <input type="text" id="city1" placeholder="Enter City 1 (e.g. Kolkata)">
    <input type="text" id="city2" placeholder="Enter City 2 (e.g. Durgapur)">
    <button id="compareBtn">Show Boundaries</button>

    <div class="legend">
        <div><span style="background:red;"></span> City 1</div>
        <div><span style="background:blue;"></span> City 2</div>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- OSM to GeoJSON converter -->
<script src="https://unpkg.com/osmtogeojson@3.0.0/osmtogeojson.js"></script>

<script>
// Initialize map
const map = L.map('map').setView([23.5, 87.3], 7);

// OSM layer
const osm = L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);

// Satellite layer
const satellite = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
        attribution: 'Tiles &copy; Esri'
    }
);

// Layer switcher
L.control.layers(
    { 'OpenStreetMap': osm, 'Satellite': satellite }
).addTo(map);

// Store current city layers
let cityLayers = [];

// Fetch city boundary from Overpass API
async function fetchCityBoundary(cityName) {

    // Add country context for better matching
    const searchName = cityName + ', India';

    const query = `
        [out:json][timeout:25];
        (
          relation["boundary"="administrative"]["name"~"${cityName}",i];
          relation["boundary"="administrative"]["official_name"~"${cityName}",i];
        );
        out geom;
    `;

    const url =
    'https://overpass.kumi.systems/api/interpreter?data=' +
    encodeURIComponent(query);

    try {
        const response = await fetch(url);

        if (!response.ok) {
            throw new Error('HTTP ' + response.status);
        }

        const data = await response.json();

        if (!data.elements || data.elements.length === 0) {
            alert('City boundary not found: ' + cityName);
            return null;
        }

        return osmtogeojson(data);

    } catch (error) {
        console.error(error);
        alert('Error fetching city: ' + cityName);
        return null;
    }
}

// Add boundary to map
function addCityToMap(cityName, geojson, color) {

    const layer = L.geoJSON(geojson, {
        style: {
            color: color,
            weight: 3,
            opacity: 0.8,
            fillOpacity: 0.15
        }
    }).bindPopup('<b>' + cityName + '</b>');

    layer.addTo(map);
    cityLayers.push(layer);
}

// Compare button
document.getElementById('compareBtn')
    .addEventListener('click', async () => {

    const city1 =
        document.getElementById('city1').value.trim();

    const city2 =
        document.getElementById('city2').value.trim();

    if (!city1 && !city2) {
        alert('Enter at least one city.');
        return;
    }

    // Remove previous layers
    cityLayers.forEach(layer => map.removeLayer(layer));
    cityLayers = [];

    // Fetch and draw city 1
    if (city1) {
        const geo1 = await fetchCityBoundary(city1);
        if (geo1) {
            addCityToMap(city1, geo1, 'red');
        }
    }

    // Fetch and draw city 2
    if (city2) {
        const geo2 = await fetchCityBoundary(city2);
        if (geo2) {
            addCityToMap(city2, geo2, 'blue');
        }
    }

    // Zoom to fit both cities
    if (cityLayers.length > 0) {
        const group = L.featureGroup(cityLayers);
        map.fitBounds(group.getBounds(), { padding: [20, 20] });
    }
});
</script>

</body>
</html>
